[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-monitor-guardian"
version = "0.7.0"
description = "Experimental safe lifecycle and policy components for isolated Windows AI desktop QA"
readme = "PUBLIC_README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
windows-broker = ["pywin32>=306; platform_system == 'Windows'"]

[tool.setuptools]
packages = ["ai_debug_display", "ai_debug_display.modules"]
