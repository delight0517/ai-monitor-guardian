name: Source tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .[windows-broker]
      - run: python -m unittest discover -s tests -v
